<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Portfolio PPG Calon Guru - Muhammad Izzul Fahmi</title>

    <!-- Tailwind CSS & Google Fonts CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        /* Style Scrollbar Rapi */
        main::-webkit-scrollbar { width: 6px; }
        main::-webkit-scrollbar-track { background: transparent; }
        main::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        main::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between pt-16 md:pt-20 pb-20 md:pb-6 px-3 sm:px-6">

    <!-- CONTAINER HEADER -->
    <div id="header-placeholder" class="w-full"></div>

    <!-- MAIN KONTEN PORTFOLIO -->
    <main id="portfolio-container" class="w-full max-w-5xl mx-auto flex-grow flex items-start justify-center min-h-[calc(100vh-7rem)] max-h-[calc(100vh-7rem)] overflow-y-auto">
        <!-- Konten dari folder pages/ akan dimuat di sini -->
    </main>

    <!-- LOGIKA SPA SINGLE-PAGE -->
    <script>
        // 1. Load Header Komponen
        async function initHeader() {
            try {
                const res = await fetch('components/header.html');
                if (!res.ok) throw new Error("Header tidak ditemukan");
                document.getElementById('header-placeholder').innerHTML = await res.text();
                
                setupFullscreenButton();
                switchTab('beranda.html'); // Default Halaman Awal
            } catch (err) {
                console.error("Gagal memuat header:", err);
            }
        }

        // 2. Perpindahan Halaman Tanpa Reload
        async function switchTab(pageFile) {
            const container = document.getElementById('portfolio-container');
            
            // Tampilan Loading Ringan
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center p-12 space-y-3 text-slate-400">
                    <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-xs font-semibold">Memuat Konten...</span>
                </div>
            `;

            try {
                const res = await fetch(`pages/${pageFile}`);
                if (!res.ok) throw new Error('Halaman tidak ditemukan');
                
                container.innerHTML = await res.text();
                updateHeaderButtons(pageFile);
                container.scrollTop = 0;

                // Event Listener Sub-Tab Khusus
                if (pageFile === 'pembelajaran.html') setupPembelajaranSubTabs();
            } catch (err) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 border border-slate-200 text-center w-full shadow-sm space-y-2">
                        <p class="text-slate-700 font-bold">Gagal memuat halaman ${pageFile}</p>
                        <p class="text-xs text-slate-400">Pastikan file berada di folder pages/ dan struktur URL benar.</p>
                    </div>
                `;
            }
        }

        // 3. Handling Sub-Tab Pembelajaran (Pertemuan 1 / 2)
        function setupPembelajaranSubTabs() {
            const btnP1 = document.getElementById('tab-btn-p1');
            const btnP2 = document.getElementById('tab-btn-p2');
            const p1Content = document.getElementById('content-p1');
            const p2Content = document.getElementById('content-p2');

            if (!btnP1 || !btnP2 || !p1Content || !p2Content) return;

            btnP1.onclick = () => {
                p1Content.classList.remove('hidden');
                p2Content.classList.add('hidden');
                btnP1.className = "w-1/2 py-2 px-4 rounded-xl text-xs md:text-sm font-bold bg-white text-blue-700 shadow-sm border-0 cursor-pointer";
                btnP2.className = "w-1/2 py-2 px-4 rounded-xl text-xs md:text-sm font-bold text-slate-500 hover:text-slate-800 border-0 cursor-pointer";
            };

            btnP2.onclick = () => {
                p1Content.classList.add('hidden');
                p2Content.classList.remove('hidden');
                btnP2.className = "w-1/2 py-2 px-4 rounded-xl text-xs md:text-sm font-bold bg-white text-purple-700 shadow-sm border-0 cursor-pointer";
                btnP1.className = "w-1/2 py-2 px-4 rounded-xl text-xs md:text-sm font-bold text-slate-500 hover:text-slate-800 border-0 cursor-pointer";
            };
        }

        // 4. Update Indicator Warna Navbar
        function updateHeaderButtons(activeFile) {
            document.querySelectorAll('.tab-btn, .tab-btn-mobile').forEach(btn => {
                const attr = btn.getAttribute('onclick') || '';
                const isCurrent = attr.includes(activeFile);

                if (btn.classList.contains('tab-btn')) {
                    btn.className = isCurrent 
                        ? "tab-btn px-3.5 py-1.5 rounded-lg bg-blue-600 text-white font-bold shadow-sm transition-all border-0 cursor-pointer"
                        : "tab-btn px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-blue-600 hover:bg-slate-100 transition-all border-0 cursor-pointer";
                } else {
                    btn.className = isCurrent 
                        ? "tab-btn-mobile p-2.5 rounded-xl bg-blue-600 text-white shadow-md transition-all border-0 cursor-pointer"
                        : "tab-btn-mobile p-2.5 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition-all border-0 cursor-pointer";
                }
            });
        }

        // 5. Toggle Layar Penuh (Fullscreen)
        function setupFullscreenButton() {
            const btn = document.getElementById('btn-fullscreen-toggle');
            if (!btn) return;
            btn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initHeader);
    </script>
</body>
</html>
